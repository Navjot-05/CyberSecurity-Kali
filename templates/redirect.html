<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirect</title>
</head>
<body>
    <h1>Open Redirect</h1>
    <a href="/open?url=http://127.0.0.1:5000">
        <img src="../static/logo.png" style="height: 100px; width: 100px;">
    </a>
    <form action="/open">
        <label for="url">Redirect to:</label>
        <input type="text" name="url" placeholder="Your URL">
        <button type="submit" value="Go">Submit</button>
    </form>
</body>
</html>
